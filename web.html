        }

        @keyframes glitch {

            40% { transform: translate(-3px, -3px) }
            60% { transform: translate(3px, 3px) }

                ]

        // ノイズバッファの作成（風・雨のような環境音）
        function createNoiseBuffer(ctx) {
            const bufferSize = ctx.sampleRate * 2;
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const output = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                output[i] = Math.random() * 2 - 1;
            }
            return buffer;
        }

        function toggleAmbientAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            if (isAudioPlaying) {
                if (masterGain) {
                    masterGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
                    setTimeout(() => {
                        try {
                            if (noiseNode) noiseNode.stop();
                            if (droneOsc1) droneOsc1.stop();
                            if (droneOsc2) droneOsc2.stop();
                            if (lfoOsc) lfoOsc.stop();
                        } catch(e) {}
                        isAudioPlaying = false;
                        if (audioIcon) audioIcon.textContent = '🔇';
                        if (audioLabel) audioLabel.textContent = '環境音 OFF';
                    }, 500);
                }
            } else {
                try {
                    const now = audioCtx.currentTime;

                    // マスターゲイン
                    masterGain = audioCtx.createGain();
                    masterGain.gain.setValueAtTime(0.001, now);
                    masterGain.gain.exponentialRampToValueAtTime(0.12, now + 1.0);

                    // 1. ノイズソース（不気味な風・不協和音の音）
                    const noiseBuffer = createNoiseBuffer(audioCtx);
                    noiseNode = audioCtx.createBufferSource();
                    noiseNode.buffer = noiseBuffer;
                    noiseNode.loop = true;

                    // ノイズ用バンドパスフィルター（風の唸り声のような音）
                    const noiseFilter = audioCtx.createBiquadFilter();
                    noiseFilter.type = 'bandpass';
                    noiseFilter.frequency.setValueAtTime(320, now);
                    noiseFilter.Q.setValueAtTime(3.0, now);

                    // 風の周期的なうねりを生むLFO
                    lfoOsc = audioCtx.createOscillator();
                    lfoOsc.frequency.setValueAtTime(0.15, now); // 0.15Hzのゆったりとした周期
                    const lfoGain = audioCtx.createGain();
                    lfoGain.gain.setValueAtTime(180, now);
                    lfoOsc.connect(lfoGain);
                    lfoGain.connect(noiseFilter.frequency);

                    // 2. ドローン音（闇を感じさせる重低音）
                    droneOsc1 = audioCtx.createOscillator();
                    droneOsc2 = audioCtx.createOscillator();
                    droneOsc1.type = 'sawtooth';
                    droneOsc2.type = 'sine';

                    droneOsc1.frequency.setValueAtTime(65.41, now); // C2
                    droneOsc2.frequency.setValueAtTime(68.80, now); // C2から少しずらして不快なうなりを生む

                    const droneFilter = audioCtx.createBiquadFilter();
                    droneFilter.type = 'lowpass';
                    droneFilter.frequency.setValueAtTime(220, now);

                    // 接続
                    noiseNode.connect(noiseFilter);
                    noiseFilter.connect(masterGain);

                    droneOsc1.connect(droneFilter);
                    droneOsc2.connect(droneFilter);
                    droneFilter.connect(masterGain);

                    masterGain.connect(audioCtx.destination);

                    // 再生開始
                    noiseNode.start(now);
                    droneOsc1.start(now);
                    droneOsc2.start(now);
                    lfoOsc.start(now);

                    isAudioPlaying = true;
                    if (audioIcon) audioIcon.textContent = '🔊';
                    if (audioLabel) audioLabel.textContent = '環境音 ON';
                } catch(e) {
                    console.error("Audio Playback Error:", e);
                }
            }
        }

        function searchKeyword(keyword) {
            if (searchInput) searchInput.value = keyword;
            handleSearch();
        }

        function handleSearch() {
            const rawVal = searchInput ? searchInput.value.trim() : '';
            if (!rawVal) return;

            const query = rawVal.toLowerCase();
            const secretKeywords = ['神崎', 'かんざき', 'カンザキ', 'kanzaki', '神崎達也', 'かんざきたつや'];

            if (secretKeywords.some(k => query.includes(k))) {
                if (secretModalContent) {
                    secretModalContent.innerHTML = `
                        <div class="space-y-4 text-xs md:text-sm">

                                <strong>【緊急捜査資料：全11話の全貌】</strong><br>
                                容疑者：<strong>神崎 達也（カンザキ タツヤ）</strong> / 41歳<br>
                                指名手配容疑：住居侵入、盗聴・盗撮、連続殺人・死体遺棄
                            </div>
                            <p class="leading-relaxed">
                                一連の投稿記事はフィクションではありません。指名手配犯・神崎達也が自ら仕掛けた「次なる犠牲者誘き寄せ（ハンティング）用Webサイト」です。
                            </p>
                            <ul class="list-disc pl-5 space-y-2 text-zinc-300">
                                <li><strong>STORY #01:</strong> 神崎が女性を首吊り殺害後、アパート管理会社社員に偽装して現場に居合わせ隠蔽（名札に『衤』）。</li>
                                <li><strong>STORY #02:</strong> 逃走中、民家の押入れ天井裏に長期間密かに潜伏（作業着『K』）。</li>
                                <li><strong>STORY #03:</strong> 天井裏からICレコーダーで生活音を盗聴・ラジオ番組へ不気味な投稿（『kazakin』＝kanzaki）。</li>
                                <li><strong>STORY #04:</strong> ターゲットのスマートスピーカーへBluetooth (KZ_HOST_09) 経由で不法侵入。</li>
                                <li><strong>STORY #05:</strong> 管理会社等を騙り合鍵を複製（複製キー#04）、侵入を重ねる。</li>
                                <li><strong>STORY #06:</strong> デジカメ (KZK_IMG) でターゲットの行動履歴や部屋番号を盗撮。</li>
                                <li><strong>STORY #07:</strong> 空き部屋（402号室）をアジト化し鍵を密売。</li>
                                <li><strong>STORY #08 & #09:</strong> 配信者のテント侵入、山道でタクシー運転手を殺害して逃亡（ラジオニュース『か……き』）。</li>
                                <li><strong>STORY #10:</strong> 警察が押収したレコーダー。神崎はこのWebサイトを作成し、閲覧者をリアルタイムで特定・追跡中。</li>
                                <li><strong>STORY #11:</strong> 神崎を認識したあなたのもとへ、彼はいま向かっています。</li>
                            </ul>
                            <div class="p-3 bg-zinc-900 border border-zinc-800 rounded-lg text-zinc-400 font-mono text-center">
                                ⚠️ 警告：あなたのお手元のスマートロック・ドアは解錠されました。
                            </div>
                        </div>
                    `;
                }
                if (secretModal) secretModal.classList.remove('hidden');
            } else {
                const matched = [];
                stories.forEach((s, idx) => {
                    const textAll = s.title + ' ' + s.paragraphs.join(' ');
                    if (textAll.includes(rawVal)) {
                        matched.push({ index: idx, story: s });
                    }
                });

                if (keywordModalTitle) keywordModalTitle.textContent = `キーワード検索: 「${rawVal}」 (${matched.length}件一致)`;

                if (keywordModalContent) {
                    if (matched.length === 0) {
                        keywordModalContent.innerHTML = `
                            <div class="p-8 text-center text-zinc-500 font-mono">
                                該当する記録または人物データが見つかりませんでした。<br>
                                作中の不審な言動や合鍵・部屋番号・名札等から『真相』に繋がる人物名を検索してください。
                            </div>
                        `;
                    } else {
                        keywordModalContent.innerHTML = matched.map(m => `
                            <div onclick="selectStory(${m.index}); if(keywordModal) keywordModal.classList.add('hidden');" class="p-4 bg-zinc-950 hover:bg-rose-950/40 border border-zinc-800 hover:border-rose-800 rounded-xl cursor-pointer transition group">
                                <div class="flex items-center justify-between text-xs font-mono text-rose-500 mb-1">
                                    <span>${m.story.number}</span>
                                    <span>${m.story.date}</span>
                                </div>
                                <h4 class="font-bold font-novel text-zinc-200 group-hover:text-rose-300 text-sm mb-1">${m.story.title}</h4>
                                <p class="text-xs text-zinc-400 line-clamp-2">${m.story.paragraphs[0]}</p>
                            </div>
                        `).join('');
                    }
                }
                if (keywordModal) keywordModal.classList.remove('hidden');
            }
        }

        function renderMenu() {
            if (!storyMenuEl) return;
            const maxStories = isStory11Unlocked ? stories.length : 10;

            let html = '';
            for (let i = 0; i < maxStories; i++) {
                const s = stories[i];
                const isActive = i === currentIndex;
                html += `
                    <button onclick="selectStory(${i})" class="w-full text-left px-3 py-2 rounded-lg transition text-xs flex items-center justify-between ${
                        isActive 
                            ? 'bg-rose-950/80 text-rose-200 border border-rose-800/80 font-bold'

                    }">

                    </button>

            }
            storyMenuEl.innerHTML = html;
        }

        function selectStory(index) {
            loadStory(index);
        }

        function loadStory(index) {
            currentIndex = index;

            if (currentIndex === 9 && !isStory11Unlocked) {
                isStory11Unlocked = true;
                const storyCountBadge = document.getElementById('story-count-badge');
                if (storyCountBadge) storyCountBadge.textContent = '全11話';
                const archiveBadge = document.getElementById('archive-badge');

                                <span class="text-xs font-serif group-hover:text-rose-200">1. ドアの覗き穴（ドアスコープ）から外を覗く</span>
                                <span class="text-[10px] text-zinc-500 font-mono">▶ 実行</span>
                            </button>
                            <button onclick="triggerEnding(2)" class="w-full text-left bg-zinc-900 hover:bg-rose-950/80 hover:border-rose-700 text-zinc-200 p-3.5 rounded-xl border border-zinc-800 transition flex items-center justify-between group">
                                <span class="text-xs font-serif group-hover:text-rose-200">2. 鍵をしっかり締め、ベッドで布団をかぶる</span>
                                <span class="text-[10px] text-zinc-500 font-mono">▶ 実行</span>
                            </button>
                            <button onclick="triggerEnding(3)" class="w-full text-left bg-zinc-900 hover:bg-rose-950/80 hover:border-rose-700 text-zinc-200 p-3.5 rounded-xl border border-zinc-800 transition flex items-center justify-between group">
                                <span class="text-xs font-serif group-hover:text-rose-200">3. スマホを取り出し、急いで110番に通報する</span>
                                <span class="text-[10px] text-zinc-500 font-mono">▶ 実行</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            if (storyBodyEl) storyBodyEl.innerHTML = bodyContent;

            const totalVisibleStories = isStory11Unlocked ? 11 : 10;
            if (readCounterEl) readCounterEl.textContent = `${currentIndex + 1} / ${totalVisibleStories}`;

            if (prevBtn) prevBtn.disabled = currentIndex === 0;
            if (nextBtn) nextBtn.disabled = currentIndex === (isStory11Unlocked ? stories.length - 1 : 9);

            renderMenu();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function triggerEnding(id) {
            const ending = endingData[id];
            if (!ending) return;

            unlockedEndings.add(id);

            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(160, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) {}

            document.body.classList.add('animate-glitch');
            setTimeout(() => document.body.classList.remove('animate-glitch'), 450);

            if (endingBadge) endingBadge.textContent = ending.badge;
            if (endingTitle) endingTitle.textContent = ending.title;
            if (endingBody) endingBody.innerHTML = ending.text;

            const countBadge = document.getElementById('ending-count-badge');
            if (countBadge) countBadge.textContent = unlockedEndings.size;

            if (endingModal) endingModal.classList.remove('hidden');
        }

        if (retryEndingBtn) retryEndingBtn.addEventListener('click', () => {
            if (endingModal) endingModal.classList.add('hidden');
        });

        if (endingToSecretBtn) endingToSecretBtn.addEventListener('click', () => {
            if (endingModal) endingModal.classList.add('hidden');
            if (searchInput) {
                searchInput.focus();
                searchInput.scrollIntoView({ behavior: 'smooth' });
            }
        });

        if (closeModalBtn) closeModalBtn.addEventListener('click', () => {
            if (secretModal) secretModal.classList.add('hidden');
        });

        if (closeKeywordModalBtn) closeKeywordModalBtn.addEventListener('click', () => {
            if (keywordModal) keywordModal.classList.add('hidden');
        });

        if (searchBtn) searchBtn.addEventListener('click', handleSearch);
        if (searchInput) {
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleSearch();
            });
        }

        if (prevBtn) prevBtn.addEventListener('click', () => {
            if (currentIndex > 0) selectStory(currentIndex - 1);
        });

        if (nextBtn) nextBtn.addEventListener('click', () => {
            if (currentIndex < stories.length - 1) selectStory(currentIndex + 1);
        });

        if (audioToggleBtn) audioToggleBtn.addEventListener('click', toggleAmbientAudio);

        // Initialize Application Page Load
        loadStory(0);
    </script>
